<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Interactive map of the Agent Playbook: repository initialization and the task workflow">
  <title>Agent Playbook Flow</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f5f3ee;
      --surface: #fffdf8;
      --surface-2: #ebe7de;
      --text: #242722;
      --muted: #5f645c;
      --line: #bbb8ae;
      --accent: #176b5b;
      --accent-soft: #d9ebe4;
      --accent-text: #0f4d41;
      --warning: #8a4d10;
      --warning-soft: #f7e4c8;
      --shadow: 0 16px 40px rgba(55, 49, 39, 0.08);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #181a17;
        --surface: #22251f;
        --surface-2: #2d302a;
        --text: #f2f0e9;
        --muted: #b5b8ae;
        --line: #555a50;
        --accent: #7dcbb8;
        --accent-soft: #24483f;
        --accent-text: #bcebdc;
        --warning: #efb66e;
        --warning-soft: #4c3821;
        --shadow: 0 16px 40px rgba(0, 0, 0, 0.22);
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
    }

    button { font: inherit; }

    button:focus-visible, a:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 2px;
    }

    a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 3px; }
    code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.86em; overflow-wrap: anywhere; }

    .shell {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 32px 0 48px;
    }

    header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 24px;
      align-items: end;
      margin-bottom: 28px;
    }

    .eyebrow {
      color: var(--accent);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1, h2, h3, p { margin-top: 0; }
    h1 { margin-bottom: 8px; font-size: clamp(2rem, 5vw, 4rem); line-height: 1; letter-spacing: -0.04em; }
    h2 { margin-bottom: 8px; font-size: 1.18rem; }
    h3 { margin-bottom: 4px; font-size: 1rem; overflow-wrap: anywhere; }
    header p { max-width: 720px; margin-bottom: 0; color: var(--muted); }

    .back-link { font-weight: 650; }
    .header-actions { display: grid; justify-items: end; gap: 12px; }
    .lang { --count: 2; width: 120px; }
    .lang button { min-height: 36px; padding: 4px 8px; font-size: 0.84rem; }

    .section-title {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin: 0 0 12px;
      font-size: 1.5rem;
      letter-spacing: -0.02em;
    }
    .section-title > span:first-child { color: var(--accent); font-size: 0.95rem; font-weight: 800; }
    section + .section-title { margin-top: 36px; }

    .panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 18px;
      box-shadow: var(--shadow);
      min-width: 0;
    }
    .panel p { margin-bottom: 0; color: var(--muted); }

    .picker { margin-bottom: 20px; }

    .field-label { display: block; margin-bottom: 7px; color: var(--muted); font-size: 0.84rem; font-weight: 650; }

    .overview {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 32px;
    }
    .overview a {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 2px 12px;
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--surface);
      color: var(--text);
      text-decoration: none;
      min-width: 0;
    }
    .overview a:hover { border-color: var(--accent); }
    .overview .n {
      grid-row: span 2;
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--accent-soft);
      color: var(--accent-text);
      font-weight: 800;
      font-size: 0.9rem;
    }
    .overview strong { font-size: 0.98rem; }
    .overview span:last-child { color: var(--muted); font-size: 0.84rem; }

    .prompt { display: grid; gap: 8px; }
    .prompt-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .prompt pre {
      margin: 0;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--bg);
      overflow-x: auto;
      font-size: 0.84rem;
      line-height: 1.45;
    }
    .copy {
      min-height: 36px;
      padding: 4px 14px;
      border: 1px solid var(--accent);
      border-radius: 10px;
      background: var(--accent);
      color: var(--surface);
      font-weight: 650;
      cursor: pointer;
    }
    .prompt p { font-size: 0.84rem; }

    .tasks { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
    .task {
      display: grid;
      align-content: space-between;
      gap: 10px;
      min-height: 96px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--bg);
      color: var(--text);
      text-align: left;
      cursor: pointer;
      min-width: 0;
    }
    .task:hover { border-color: var(--accent); }
    .task[aria-pressed="true"] { border: 2px solid var(--accent); padding: 11px 13px; background: var(--accent-soft); }
    .task span:first-child { overflow-wrap: anywhere; }
    .badge {
      justify-self: start;
      padding: 2px 9px;
      border-radius: 999px;
      background: var(--surface-2);
      color: var(--text);
      font-size: 0.74rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .badge.full { background: var(--warning-soft); color: var(--warning); }
    .badge.standard { background: var(--accent-soft); color: var(--accent-text); }
    .route-pick { margin-top: 16px; }
    .route-pick .toggle { max-width: 560px; }
    .checks-title { margin: 14px 0 0; color: var(--muted); font-size: 0.84rem; font-weight: 650; }
    .worked { margin-top: 12px; font-size: 0.88rem; }

    .toggle { display: grid; grid-template-columns: repeat(var(--count, 4), minmax(0, 1fr)); gap: 8px; }

    .toggle button {
      min-height: 44px;
      padding: 6px 10px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--bg);
      color: var(--text);
      cursor: pointer;
    }

    .toggle button[aria-pressed="true"] {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--surface);
      font-weight: 650;
    }

    .init { display: grid; gap: 16px; }
    .init .toggle { --count: 2; max-width: 520px; }

    .steps {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      counter-reset: step;
    }

    .steps li {
      counter-increment: step;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--bg);
      min-width: 0;
    }

    .steps li::before {
      content: counter(step, decimal-leading-zero);
      display: block;
      color: var(--accent);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.08em;
    }

    .steps strong { display: block; margin: 2px 0 4px; }
    .steps span { display: block; color: var(--muted); font-size: 0.84rem; overflow-wrap: anywhere; }

    .files { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 16px; }
    .files ul { margin: 8px 0 0; padding-left: 18px; color: var(--muted); font-size: 0.88rem; }
    .files li + li { margin-top: 4px; }

    .summary {
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr);
      gap: 16px;
      margin-bottom: 20px;
    }

    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .chip { padding: 6px 9px; border-radius: 999px; background: var(--accent-soft); color: var(--accent-text); font-size: 0.78rem; font-weight: 700; }

    .ask {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 12px;
      align-items: start;
    }

    .ask-mark {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--warning-soft);
      color: var(--warning);
      font-weight: 800;
    }

    .flow {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 20px 28px;
    }

    .stage {
      position: relative;
      min-height: 170px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--surface);
      opacity: 0.45;
      transition: opacity 180ms ease, border-color 180ms ease, box-shadow 180ms ease;
      min-width: 0;
    }

    .stage.active { opacity: 1; border-color: var(--accent); }
    .stage.gate.active { border-width: 2px; box-shadow: 0 0 0 4px var(--accent-soft); }

    .stage::after {
      content: "→";
      position: absolute;
      right: -21px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--line);
      font-size: 1.1rem;
      font-weight: 800;
    }
    .stage:nth-child(4n)::after, .stage:last-child::after { content: none; }

    .number { color: var(--accent); font-size: 0.78rem; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; }
    .stage ul { margin: 10px 0 0; padding-left: 18px; color: var(--muted); font-size: 0.84rem; }
    .stage li { overflow-wrap: anywhere; }
    .stage li + li { margin-top: 5px; }

    .route-note {
      margin: 16px 0 0;
      padding: 13px 15px;
      border-left: 4px solid var(--accent);
      background: var(--accent-soft);
      color: var(--accent-text);
      border-radius: 0 10px 10px 0;
    }

    .legend { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 16px; color: var(--muted); font-size: 0.8rem; }
    .legend span { display: inline-flex; align-items: center; gap: 7px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--line); }
    .dot.active { background: var(--accent); }
    .dot.gate { background: var(--surface); border: 2px solid var(--accent); }

    .footnote { margin-top: 20px; color: var(--muted); font-size: 0.86rem; }
    .models { margin-top: 20px; }
    .tiers { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 12px; }
    .tier { padding: 14px; border: 1px solid var(--line); border-radius: 14px; background: var(--bg); min-width: 0; }
    .tier strong { display: block; color: var(--accent); text-transform: uppercase; letter-spacing: 0.08em; font-size: 0.78rem; }
    .tier span { display: block; margin-top: 4px; color: var(--muted); font-size: 0.86rem; overflow-wrap: anywhere; }
    .context-rules { margin: 14px 0 0; padding-left: 18px; color: var(--muted); font-size: 0.88rem; }
    .context-rules li + li { margin-top: 4px; }

    @media (max-width: 900px) {
      .flow { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .stage::after { content: none; }
      .files { grid-template-columns: 1fr; }
      .steps { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .tiers { grid-template-columns: 1fr; }
    }

    @media (max-width: 760px) {
      .shell { width: calc(100% - 32px); padding-top: 20px; }
      header, .summary, .overview { grid-template-columns: 1fr; }
      header { align-items: start; }
      .header-actions { justify-items: start; grid-auto-flow: column; align-items: center; }
      .toggle { --count: 2; }
    }

    @media (max-width: 480px) {
      .flow, .steps { grid-template-columns: 1fr; }
      .stage { min-height: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .stage { transition: none; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <div class="eyebrow">Agent Playbook</div>
        <h1 data-i18n="title"></h1>
        <p data-i18n="lead"></p>
      </div>
      <div class="header-actions">
        <div class="toggle lang" role="group" aria-label="Language">
          <button type="button" data-lang="en" aria-pressed="true" lang="en">EN</button>
          <button type="button" data-lang="uk" aria-pressed="false" lang="uk">UA</button>
        </div>
        <a class="back-link" href="https://github.com/Kost927/agent-playbook#readme" data-i18n="readPlaybook"></a>
      </div>
    </header>

    <nav class="overview" data-i18n-label="overviewLabel">
      <a href="#init"><span class="n">1</span><strong data-i18n="ov1t"></strong><span data-i18n="ov1d"></span></a>
      <a href="#task"><span class="n">2</span><strong data-i18n="ov2t"></strong><span data-i18n="ov2d"></span></a>
      <a href="#lifecycle"><span class="n">3</span><strong data-i18n="ov3t"></strong><span data-i18n="ov3d"></span></a>
    </nav>

    <h2 class="section-title" id="init"><span>1</span><span class="title-text" data-i18n="initTitle"></span></h2>
    <section class="panel init" aria-labelledby="init-label">
      <div class="prompt">
        <div class="prompt-head">
          <h3 data-i18n="promptTitle"></h3>
          <button type="button" class="copy" id="copy-prompt" data-i18n="copy"></button>
        </div>
        <pre><code id="prompt-text"></code></pre>
        <p data-i18n="promptNote"></p>
      </div>
      <div>
        <span class="field-label" id="init-label" data-i18n="initLabel"></span>
        <div class="toggle" role="group" aria-labelledby="init-label">
          <button type="button" data-init="existing" aria-pressed="true" data-i18n="initExisting"></button>
          <button type="button" data-init="greenfield" aria-pressed="false" data-i18n="initGreenfield"></button>
        </div>
      </div>
      <p id="init-intro"></p>
      <ol id="init-steps" class="steps" aria-live="polite"></ol>
      <div class="files">
        <div>
          <h3 data-i18n="filesTitle"></h3>
          <ul id="init-files"></ul>
        </div>
        <div>
          <h3 data-i18n="exampleTitle"></h3>
          <p id="init-example"></p>
        </div>
      </div>
    </section>

    <h2 class="section-title" id="task"><span>2</span><span class="title-text" data-i18n="taskTitle"></span></h2>
    <section data-i18n-label="taskTitle">
      <div class="panel picker">
        <span class="field-label" id="task-label" data-i18n="taskLabel"></span>
        <div class="tasks" id="tasks" role="group" aria-labelledby="task-label"></div>
        <div class="route-pick">
          <span class="field-label" id="route-label" data-i18n="routeLabel"></span>
          <div class="toggle" role="group" aria-labelledby="route-label">
            <button type="button" data-route="direct" aria-pressed="false">Direct</button>
            <button type="button" data-route="fast" aria-pressed="false">Fast</button>
            <button type="button" data-route="standard" aria-pressed="true">Standard</button>
            <button type="button" data-route="full" aria-pressed="false">Full</button>
          </div>
        </div>
      </div>

      <div class="summary" aria-live="polite">
        <article class="panel">
          <h2 id="why-title"></h2>
          <p id="why-copy"></p>
          <p class="checks-title" id="checks-title"></p>
          <div id="checks" class="chips"></div>
          <p class="worked" id="worked"></p>
        </article>
        <article class="panel ask">
          <div class="ask-mark" aria-hidden="true">?</div>
          <div>
            <h2 id="ask-title"></h2>
            <p id="ask-copy"></p>
          </div>
        </article>
      </div>

      <div class="panel" id="lifecycle">
        <h2 data-i18n="lifecycleTitle"></h2>
        <ol class="flow" id="flow"></ol>
        <p id="route-note" class="route-note"></p>
        <div class="legend">
          <span><i class="dot active"></i><span data-i18n="legendActive"></span></span>
          <span><i class="dot"></i><span data-i18n="legendCollapsed"></span></span>
          <span><i class="dot gate"></i><span data-i18n="legendGate"></span></span>
        </div>
      </div>

      <div class="panel models">
        <h2 data-i18n="modelsTitle"></h2>
        <p data-i18n="modelsLead"></p>
        <div class="tiers" id="tiers"></div>
        <ul id="context-rules" class="context-rules"></ul>
      </div>

      <p class="footnote" data-i18n-html="footnote"></p>
    </section>
  </main>

  <script>
    const STAGE_IDS = ["discover", "route", "specify", "checkpoint", "test", "implement", "review", "ship"];
    const ROUTE_STAGES = {

    const $ = (id) => document.getElementById(id);
    const initButtons = [...document.querySelectorAll("[data-init]")];
    const routeButtons = [...document.querySelectorAll("[data-route]")];
    const langButtons = [...document.querySelectorAll("[data-lang]")];
    const state = { lang: "en", init: "existing", route: "standard", task: "due-dates" };
    try {
      const saved = localStorage.getItem("playbook-flow-lang");
      if (saved && TEXT[saved]) state.lang = saved;
    } catch (error) { /* storage unavailable: keep the default */ }

    const t = () => TEXT[state.lang];

    function press(buttons, key, value) {
      buttons.forEach((button) => button.setAttribute("aria-pressed", String(button.dataset[key] === value)));
    }

    function element(tag, text, className) {
      const node = document.createElement(tag);
      if (text !== undefined) node.textContent = text;
      if (className) node.className = className;
      return node;
    }

    function renderStatic() {
      document.documentElement.lang = state.lang;
      press(langButtons, "lang", state.lang);
      document.querySelectorAll("[data-i18n]").forEach((node) => { node.textContent = t()[node.dataset.i18n]; });
      document.querySelectorAll("[data-i18n-html]").forEach((node) => { node.innerHTML = t()[node.dataset.i18nHtml]; });
      document.querySelectorAll("[data-i18n-label]").forEach((node) => node.setAttribute("aria-label", t()[node.dataset.i18nLabel]));
      $("prompt-text").textContent = PROMPT;
    }

    function renderInit() {
      const init = t().init[state.init];
      press(initButtons, "init", state.init);
      $("init-intro").textContent = init.intro;
      $("init-steps").replaceChildren(...init.steps.map(([title, text]) => {
        const item = element("li");
        item.append(element("strong", title), element("span", text));
        return item;
      }));
      $("init-files").replaceChildren(...INIT_FILES[state.init].map((file) => {
        const item = element("li");
        item.append(element("code", file), document.createTextNode(init.notes[file] || ""));
        return item;
      }));
      $("init-example").innerHTML = init.example;
    }

    function renderTasks() {
      $("tasks").replaceChildren(...TASKS.map((task) => {
        const button = element("button", undefined, "task");
        button.type = "button";
        button.setAttribute("aria-pressed", String(state.task === task.id));
        button.append(element("span", t().tasks[task.id][0]), element("span", ROUTE_NAMES[task.route], "badge " + task.route));
        button.addEventListener("click", () => { state.task = task.id; state.route = task.route; renderTasks(); renderRoute(); });
        return button;
      }));
      const task = TASKS.find((item) => item.id === state.task);
      if (task) {
        const [, why, checks] = t().tasks[task.id];
        $("why-title").textContent = t().whyPrefix + ROUTE_NAMES[task.route];
        $("why-copy").textContent = why;
        $("checks-title").textContent = t().checksTitle;
        $("checks").replaceChildren(...checks.map((name) => element("span", name, "chip")));
        $("worked").replaceChildren();
        if (task.link) {
          const link = element("a", t().worked);
          link.href = task.link;
          $("worked").append(link);
        }
      } else {
        $("why-title").textContent = t().manualTitle;
        $("why-copy").textContent = t().manualCopy;
        $("checks-title").textContent = "";
        $("checks").replaceChildren();
        $("worked").replaceChildren();
      }
    }

    function renderRoute() {
      press(routeButtons, "route", state.route);
      const active = ROUTE_STAGES[state.route];
      $("flow").replaceChildren(...STAGE_IDS.map((id, index) => {
        const [label, title, points] = t().stages[id];
        const stage = element("li", undefined, "stage" + (id === "checkpoint" ? " gate" : "") + (active.includes(id) ? " active" : ""));
        stage.dataset.stage = id;
        const list = element("ul");
        list.append(...points.map((point) => element("li", point)));
        stage.append(element("div", String(index + 1).padStart(2, "0") + " · " + label, "number"), element("h3", title), list);
        return stage;
      }));
      const [askTitle, askCopy] = t().ask[GATED[state.route] ? "gate" : "proceed"];
      $("ask-title").textContent = askTitle;
      $("ask-copy").textContent = askCopy;
      $("route-note").textContent = t().notes[state.route];
    }

    function renderModels() {
      $("tiers").replaceChildren(...t().tiers.map(([tier, use]) => {
        const box = element("div", undefined, "tier");
        box.append(element("strong", tier), element("span", use));
        return box;
      }));
      $("context-rules").replaceChildren(...t().contextRules.map((rule) => element("li", rule)));
    }

    function renderAll() {
      renderStatic();
      renderModels();
      renderInit();
      renderTasks();
      renderRoute();
    }

    langButtons.forEach((button) => button.addEventListener("click", () => {
      state.lang = button.dataset.lang;
      try { localStorage.setItem("playbook-flow-lang", state.lang); } catch (error) { /* ignore */ }
      renderAll();
    }));
    initButtons.forEach((button) => button.addEventListener("click", () => { state.init = button.dataset.init; renderInit(); }));
    routeButtons.forEach((button) => button.addEventListener("click", () => {
      state.route = button.dataset.route;
      const task = TASKS.find((item) => item.id === state.task);
      if (!task || task.route !== state.route) state.task = null;
      renderTasks();
      renderRoute();
    }));
    $("copy-prompt").addEventListener("click", async () => {
      const button = $("copy-prompt");
      try {
        await navigator.clipboard.writeText(PROMPT);
      } catch (error) {
        const range = document.createRange();
        range.selectNodeContents($("prompt-text"));
        const selection = window.getSelection();
        selection.removeAllRanges();
        selection.addRange(range);
        try { document.execCommand("copy"); } catch (ignored) { /* the text stays selected for manual copy */ }
      }
      button.textContent = t().copied;
      setTimeout(() => { button.textContent = t().copy; }, 1600);
    });

    renderAll();
  </script>
</body>
</html>
